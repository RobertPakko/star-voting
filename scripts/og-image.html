<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: linear-gradient(135deg, #7d14ff, #47bfff);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 64px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #fff;
      }
      .mark {
        width: 300px;
        height: 300px;
        border-radius: 72px;
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25) inset;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -2px;
        line-height: 1;
      }
      p {
        margin: 20px 0 0;
        font-size: 46px;
        font-weight: 500;
        opacity: 0.95;
      }
      .url {
        margin-top: 36px;
        font-size: 30px;
        font-weight: 600;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="220" height="220" viewBox="2 1.6 20 19">
        <path
          fill="#fff"
          d="M12 2 14.94 7.95 21.51 8.91 16.76 13.55 17.88 20.09 12 17 6.12 20.09 7.25 13.55 2.49 8.91 9.06 7.95Z"
        />
      </svg>
    </div>
    <div>
      <h1>ChoiceLab</h1>
      <p>Better group decisions</p>
      <div class="url">choicelab.app</div>
    </div>
  </body>
</html>
