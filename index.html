<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STAR Voting</title>
    <script>
      // Resolve the stored colour scheme before first paint. MantineProvider
      // sets this same attribute, but only once the bundle has run — by which
      // point a dark-mode reader has already been shown a white page. Mirrors
      // Mantine's own ColorSchemeScript, with "auto" as the default to match
      // the defaultColorScheme in main.tsx.
      try {
        var stored = window.localStorage.getItem('mantine-color-scheme-value')
        var scheme = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto'
        var computed =
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', computed)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
