<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STAR Voting</title>
    <meta
      name="description"
      content="Make a poll, share it, and get an easy and accurate result using STAR voting."
    />

    <!-- The card a chat app draws under a pasted link. Every poll link gets
         this same card: its poll is in the #fragment, which is never sent to
         the server, so the crawler fetching the link is served this file
         whatever poll it points at. See "Link previews" in AGENTS.md, which
         also says why there is deliberately no og:url. The image address is
         absolute because crawlers do not reliably resolve a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChoiceLab" />
    <meta property="og:title" content="STAR Voting" />
    <meta
      property="og:description"
      content="Score every option from 0 to 5 stars. The two highest scorers go to a runoff, and the one more voters prefer wins."
    />
    <meta property="og:image" content="https://choicelab.app/star-voting/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="A white star on a purple-to-blue square" />
    <meta name="twitter:card" content="summary" />

    <!-- Installing the app: the manifest is what Android and desktop Chrome
         read, and the two apple- tags below are what iOS reads instead, since
         Safari only picked up `display` and the manifest's icons in 16.4 and
         still takes the home-screen name and icon from these. The title is
         given separately because iOS truncates the label under the icon hard,
         and would otherwise cut into whatever <title> the page happened to
         have when it was added. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="STAR Voting" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The colour of the browser's toolbar, and of the status bar in an
         installed window, where it is a strip of the app itself rather than
         of the browser: left alone it is white above a dark page. It has to
         follow the theme the app is actually showing rather than the one the
         OS asked for, so it is set from the same stored choice below and kept
         in step by ThemeColorMeta afterwards. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Resolve the stored colour scheme before first paint. MantineProvider
      // sets this same attribute, but only once the bundle has run; by which
      // point a dark-mode reader has already been shown a white page. Mirrors
      // Mantine's own ColorSchemeScript, with "auto" as the default to match
      // the defaultColorScheme in main.tsx.
      try {
        var stored = window.localStorage.getItem('mantine-color-scheme-value')
        var scheme = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto'
        var computed =
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', computed)
        // --mantine-color-body, for the two schemes; see ThemeColorMeta.
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', computed === 'dark' ? '#242424' : '#ffffff')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
