name: Deploy Edge Functions

# Migrations reach the database through Supabase's GitHub integration; Edge
# Functions are deployed here, on every push to main that changes one. See
# "Push notifications" in AGENTS.md for the secrets this needs.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      # Until the two secrets exist this says so and stops, rather than
      # turning main red on a repository that has not set push up yet.
      - name: Check for Supabase credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set, so no Edge Function was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: the caller is the database, which holds no user's
      # token. The function checks a shared secret instead.
      - if: steps.creds.outputs.ready == 'true'
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
