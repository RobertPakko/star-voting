name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tally:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the version the suite is developed against. A newer one
        # should work -- nothing here is version-specific beyond the MAINTAIN
        # grant that run.sh already strips -- but bump it deliberately.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: test/run.sh
